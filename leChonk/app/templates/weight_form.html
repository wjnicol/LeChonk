{% extends "base.html" %}

{% block content %}
    <div class="breadcrumb">
        <a href="{{ url_for('main.index') }}">All Cats</a>
        <a href="{{ url_for('main.view_cat', cat_id=cat.id) }}">{{ cat.name }}</a>
        <span>{% if weight %}Edit{% else %}Add{% endif %} Weight</span>
    </div>

    <div class="card">
        <h2>{% if weight %}Edit{% else %}Add{% endif %} Weight for {{ cat.name }}</h2>
        <form method="POST">
            <div class="form-group">
                <label for="weight_kg">Weight (kg) *</label>
                <input type="number" id="weight_kg" name="weight_kg" 
                       value="{{ weight.weight_kg if weight else '' }}" step="0.01" required>
            </div>
            
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" 
                       value="{{ weight.date.isoformat() if weight else today }}">
            </div>
            
            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes">{{ weight.notes if weight else '' }}</textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Weight Entry</button>
                <a href="{{ url_for('main.view_cat', cat_id=cat.id) }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
