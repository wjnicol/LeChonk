{% extends "base.html" %}

{% block content %}
    <div class="breadcrumb">
        <a href="{{ url_for('main.index') }}">All Cats</a>
        <span>{% if cat %}Edit{{ else }}Add{% endif %} Cat</span>
    </div>

    <div class="card">
        <h2>{% if cat %}Edit {{ cat.name }}{% else %}Add New Cat{% endif %}</h2>
        <form method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Cat Name *</label>
                <input type="text" id="name" name="name" value="{{ cat.name if cat else '' }}" required>
            </div>
            
            <div class="form-group">
                <label for="breed">Breed</label>
                <input type="text" id="breed" name="breed" value="{{ cat.breed if cat else '' }}" placeholder="e.g., Domestic Shorthair">
            </div>
            
            <div class="form-group">
                <label for="birth_date">Birth Date</label>
                <input type="date" id="birth_date" name="birth_date" 
                       value="{{ cat.birth_date.isoformat() if cat and cat.birth_date else '' }}">
            </div>
            
            <div class="form-group">
                <label for="owner">Owner</label>
                <input type="text" id="owner" name="owner" 
                       value="{{ cat.owner if cat else '' }}" 
                       placeholder="e.g., John Doe">
            </div>
            
            <div class="form-group">
                <label for="microchip_number">Microchip Number</label>
                <input type="text" id="microchip_number" name="microchip_number" 
                       value="{{ cat.microchip_number if cat else '' }}" 
                       placeholder="e.g., 985123456789012">
            </div>
            
            <div class="form-group">
                <label for="place_of_birth">Place of Birth</label>
                <input type="text" id="place_of_birth" name="place_of_birth" 
                       value="{{ cat.place_of_birth if cat else '' }}" 
                       placeholder="e.g., Paris, France">
            </div>
            
            <div class="form-group">
                <label for="current_address">Current Address</label>
                <input type="text" id="current_address" name="current_address" 
                       value="{{ cat.current_address if cat else '' }}" 
                       placeholder="e.g., 123 Main St, New York">
            </div>
            
            <div class="form-group">
                <label for="profile_picture">Profile Picture</label>
                <input type="file" id="profile_picture" name="profile_picture" accept="image/*">
                {% if cat and cat.profile_picture %}
                    <div style="margin-top: 10px;">
                        <img src="{{ url_for('main.uploaded_file', filename=cat.profile_picture) }}" 
                             alt="Current profile picture" 
                             style="max-width: 150px; max-height: 150px; border-radius: 6px;">
                        <div style="margin-top: 5px;">
                            <label style="display: inline-flex; align-items: center; gap: 5px; font-size: 12px;">
                                <input type="checkbox" name="remove_profile_pic" value="1"> 
                                Remove current picture
                            </label>
                        </div>
                    </div>
                {% endif %}
            </div>
            
            <div class="form-group">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes">{{ cat.notes if cat else '' }}</textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Cat</button>
                <a href="{% if cat %}{{ url_for('main.view_cat', cat_id=cat.id) }}{% else %}{{ url_for('main.index') }}{% endif %}" 
                   class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
